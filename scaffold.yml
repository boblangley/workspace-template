questions:
  - name: domain_names
    validate:
      required: true
      min: 1
    prompt:
      message: "Domain Names"
      description: "Enter a list of domain names to bind to."
      loop: true
  - name: sdks
    validate:
      required: true
    prompt:
      multi: true
      message: "Choose SDKs"
      description: "Choose the SDKs to install"
      default: []
      options:
        - "android"
        - "bun"
        - "dotnet"
        - "flutter"
        - "go"
        - "kotlin"
        - "node"
        - "python"
        - "rust"
        - "swift"
  - name: docker
    validate:
      required: false
    prompt:
      message: "Docker Support"
      description: |
        Add Docker-in-Docker (container internal) or Docker-out-of-Docker (container host) support to the workspace.
        This creates a /workspaces/mnt/{{ .ProjectKebab }} folder as well for bind mounts.
      options:
        - "docker-in-docker"
        - "docker-out-of-docker"
messages:
  pre: |
    # Pre Message

    This is a pre message that will be shown to the user before the scaffold is generated.

    Template variables are _NOT_ available in this message.

  post: |
    # Post Message

    This is a post message that will be shown to the user after the scaffold is generated.

    You can use variables just as you would in your templates.

    {{ .ProjectKebab }}